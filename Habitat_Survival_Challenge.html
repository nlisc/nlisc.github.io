<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habitat Survival Challenge</title><style> *{box-sizing:border-box}body{margin:0;background:#14251f;color:#edf4ed;font:18px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:30px;margin:8px 0}h2{margin:8px 0}.muted{color:#b7cbbd;font-size:15px}.track{height:8px;background:#31483d;border-radius:8px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#9cdbac}.panel{background:#213a30;border:1px solid #42604e;border-radius:14px;padding:20px;margin:14px 0}.clue{padding:9px 0;border-bottom:1px solid #ffffff18}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid #587364;padding:12px;color:white;background:#20382e}button:disabled{cursor:default}button:focus-visible{outline:3px solid white}.hab{text-align:left;padding:0;overflow:hidden}.hab svg{display:block;width:100%;height:85px}.hab div{padding:12px}.hab small{display:block;color:#c6d9cb;margin-top:5px}.selected{border-color:#f5c96a}.correct{border-color:#8ce2a0}.wrong{border-color:#ed8e83}.primary{background:#b9e6a7;color:#152c1b;font-weight:bold}.primary:disabled{opacity:.45}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}.reveal{background:#294638}.emoji{font-size:50px}.question{background:#152b22;padding:12px;border-radius:8px}textarea{width:100%;background:#13271e;color:white;border:1px solid #587364;border-radius:8px;padding:10px;font:inherit}label{font-size:15px}.end{text-align:center}@media(max-width:550px){main{padding:12px}.hab small{font-size:12px}}</style><main id="game"></main><script>
const habitats=[['Arctic tundra','Very cold • Short summers • Few trees','❄️','#b9dbe8','#edf7ff'],['Hot desert','Very dry • Hot days • Scarce water','🌵','#e9c38c','#d49b53'],['Boreal forest','Cold winters • Many trees • Seasonal resources','🌲','#a8c7bd','#477b56'],['Freshwater wetland','Abundant water • Aquatic plants • Wet soil','🌾','#a6d5dc','#468e9f']];
const rounds=[
['Arctic fox','🦊',0,['I have thick fur that covers my body and feet.','My ears are small, which helps reduce heat loss.','I hunt small mammals.'],'Thick fur and small ears help reduce heat loss. Fur-covered feet provide insulation.','What disadvantage might my thick fur create in a hot desert?'],
['Saguaro cactus','🌵',1,['I store large amounts of water in my stem.','I have spines instead of broad leaves.','I can survive long periods with little rainfall.'],'Water storage and reduced leaf surface area help this cactus survive dry conditions.','Why would storing water be less important in a very wet habitat?'],
['North American beaver','🦫',3,['I have large webbed hind feet.','My fur helps keep me warm in water.','I eat bark, twigs and aquatic plants.'],'Webbed feet help with swimming, and wetlands provide water and plant food. Beavers also inhabit waterways within boreal forests.','How might the disappearance of a pond affect this organism?'],
['Black spruce','🌲',2,['I have needle-shaped leaves with a waxy coating.','I can tolerate freezing winter temperatures.','My seeds develop inside cones.'],'Needles and their waxy coating help limit water loss. Black spruce is suited to northern forests and also grows in some wetlands.','How might a waxy coating help when water in the soil is frozen?'],
['Yellow perch','🐟',3,['I use gills to obtain oxygen from water.','I have fins that help me move.','I require freshwater to survive.'],'Freshwater habitats provide water, dissolved oxygen and food.','Why would having plenty of oxygen in the air not be enough for this fish?'],
['Fennec fox','🦊',1,['I have very large ears that help release body heat.','I am mainly active at night.','I rest in underground burrows during the day.'],'Large ears help release heat, and nocturnal activity helps avoid the hottest part of the day.','Compare my ears with those of the Arctic fox. Why are they so different?'],
['Snowy owl','🦉',0,['I have dense feathers, including feathers on my feet.','I often hunt in open, treeless landscapes.','Small mammals are an important part of my diet.'],'Dense feathers provide insulation, and open tundra offers suitable hunting habitat.','How might a decline in small mammals affect my survival?'],
['Cattail','🌾',3,['My roots grow in waterlogged soil.','I have internal air spaces that help oxygen reach submerged tissues.','I grow tall leaves above the water surface.'],'Cattails have structures that help them grow in saturated soils.','What might happen to this plant during a prolonged drought?'],
['Canada lynx','🐈',2,['I have wide, furry paws that help me travel over snow.','I have a thick winter coat.','Snowshoe hares are my main prey.'],'The boreal forest provides suitable prey and habitat. Wide paws and thick fur help the lynx survive snowy winters.','Would suitable temperature alone be enough if my main prey disappeared?'],
['Kangaroo rat','🐭',1,['I obtain much of my water from the food I eat.','My body produces very concentrated urine.','I shelter in burrows during hot days.'],'These characteristics reduce water loss and help the kangaroo rat survive dry conditions.','Which characteristic is related to how my body functions rather than how it looks?'],
['Wood frog','🐸',2,['I can survive partial freezing of my body during winter.','I spend much of my time on moist forest floors.','I reproduce in temporary freshwater pools.'],'Wood frogs are suited to northern forests and need freshwater breeding habitats. A wetland is also a defensible answer.','Why might this organism require more than one habitat during its life?'],
['Arctic willow','🌿',0,['I grow very close to the ground.','I have small leaves that may be covered in fine hairs.','I can complete my seasonal growth during a short summer.'],'Low growth helps reduce exposure to strong winds, and a short growing season suits Arctic tundra.','Why might growing close to the ground be more useful here than growing into a tall tree?']];
let order=rounds.slice(),i=0,selected=-1,revealed=false,score=0,reason='',showReason=false;const root=document.querySelector('#game');
function art(h,j){return `<svg viewBox="0 0 300 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="90" fill="${h[3]}"/><circle cx="245" cy="20" r="13" fill="#fff3cc"/><path d="M0 70 Q65 20 140 65 T300 48 V90H0" fill="${h[4]}"/><text x="150" y="67" font-size="48" text-anchor="middle">${h[2]}</text></svg>`}
function render(){if(i===order.length){root.innerHTML=`<section class="panel end"><div class="emoji">🌎</div><h1>Challenge complete!</h1><h2>${score} / ${order.length}</h2><p>Best-match habitats identified. Other scientifically justified answers may also be valid.</p><p class="question">What must we consider when choosing organisms for our own ecosystem project?</p><button class="primary" onclick="reset(false)">Play again</button> <button onclick="reset(true)">Shuffle rounds</button></section>`;return}const r=order[i];root.innerHTML=`<header><div><div class="muted">Life Systems · Grades 6–8</div><h1>Habitat Survival Challenge</h1></div><div>Score: ${score} | ${i+1}/${order.length}</div></header><div class="track"><div class="bar" style="width:${(i+(revealed?1:0))/order.length*100}%"></div></div><section class="panel"><div class="muted">${rounds.indexOf(r)<6?'Habitat detective':rounds.indexOf(r)<9?'Survival specialist':'Expert challenge'}</div><h2>Mystery organism ${i+1}</h2><p class="muted">Read the clues. Which habitat best meets my needs?</p>${r[3].map((c,k)=>`<div class="clue">${k+1}. ${c}</div>`).join('')}</section><div class="choices">${habitats.map((h,j)=>`<button class="hab ${selected===j?'selected':''} ${revealed&&r[2]===j?'correct':''} ${revealed&&selected===j&&r[2]!==j?'wrong':''}" onclick="choose(${j})" ${revealed?'disabled':''}>${art(h,j)}<div><strong>${'ABCD'[j]}. ${h[0]} ${revealed&&r[2]===j?'✓':''}</strong><small>${h[1]}</small></div></button>`).join('')}</div><p><strong>Justify your answer:</strong> Which characteristic helps this organism survive, and how?</p>${showReason?`<textarea id="reason" placeholder="I chose this habitat because..." ${revealed?'disabled':''}></textarea>`:''}${revealed?`<section class="panel reveal"><div class="emoji">${r[1]}</div><div class="muted">${selected===r[2]?'Correct match!':'Best-match answer'}</div><h2>${r[0]}</h2><strong>${habitats[r[2]][0]}</strong><p>${r[4]}</p><div class="question"><strong>Bonus discussion question</strong><p>${r[5]}</p></div></section>`:''}<div class="actions">${revealed?`<button class="primary" onclick="advance()">${i===order.length-1?'Finish challenge':'Next organism →'}</button>`:`<button class="primary" onclick="reveal()" ${selected<0?'disabled':''}>Reveal mystery organism</button>`}<button onclick="advance()">Skip round</button><button onclick="reset(false)">Restart</button><label><input type="checkbox" ${showReason?'checked':''} onchange="showReason=this.checked;render()"> Written justification</label></div>`;const t=document.querySelector('#reason');if(t){t.value=reason;t.oninput=()=>reason=t.value}}
function choose(j){if(!revealed){selected=j;render()}}function reveal(){if(selected<0||revealed)return;if(selected===order[i][2])score++;revealed=true;render()}function advance(){i++;selected=-1;revealed=false;reason='';render()}function reset(shuffle){order=rounds.slice();if(shuffle)for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}i=0;selected=-1;revealed=false;score=0;reason='';render()}render();</script></html>
