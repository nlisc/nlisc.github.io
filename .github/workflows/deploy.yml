name: Publish classroom website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Generate activity catalogue
        run: python3 build_catalogue.py

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html style.css script.js catalogue.json _site/
          cp -r assets games _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
